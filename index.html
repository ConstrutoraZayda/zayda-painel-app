<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Zayda Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zayda Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; background: #EDF1EE; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #EDF1EE; }
  @media (prefers-color-scheme: dark) {
    html, body, iframe { background: #0D1410; }
  }
</style>
</head>
<body>
<iframe id="painel" title="Zayda Painel"></iframe>
<script>
  const EXEC = 'https://script.google.com/macros/s/AKfycbzUpcNapacbnO9G2Xt7aMpGInxifPbBQEM7ZokFWQ4Odv5xb4AGvxZ2CzyIEaBq8ODV/exec';
  const parametros = location.search.slice(1);
  document.getElementById('painel').src = EXEC + '?app=1' + (parametros ? '&' + parametros : '');
  window.addEventListener('message', function (e) {
    if (e.data && e.data.zayda === 'recarregar') location.reload();
  });
</script>
</body>
</html>
